<!-- Скрипт для интеграции формы с ВКонтакте (send_vk.php) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        var forms = document.querySelectorAll('form');
        
        forms.forEach(function(form) {
            // Перехватываем стандартную отправку
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                e.stopImmediatePropagation();
                
                var formData = new FormData(form);
                var submitBtn = form.querySelector('button[type="submit"]');
                var oldText = submitBtn ? submitBtn.innerText : 'Отправить';
                if(submitBtn) submitBtn.innerText = 'Отправка...';
                
                fetch('send_vk.php', {
                    method: 'POST',
                    body: formData
                })
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if(submitBtn) submitBtn.innerText = oldText;
                    
                    var successBox = form.querySelector('.t-form__successbox');
                    var inputsBox = form.querySelector('.t-form__inputsbox') || form.querySelector('.tn-atom__inputs-wrapp');
                    var buttonBox = form.querySelector('.t-form__submit');
                    
                    if(successBox) {
                        successBox.style.display = 'block';
                        successBox.style.color = '#a30000';
                        successBox.innerHTML = '<div style="text-align: center;">Анкета успешно отправлена!</div>';
                        if(inputsBox) inputsBox.style.display = 'none';
                        if(buttonBox) buttonBox.style.display = 'none';
                    } else {
                        alert('Анкета успешно отправлена! Ждем вас на нашей свадьбе!');
                    }
                })
                .catch(function(error) {
                    if(submitBtn) submitBtn.innerText = oldText;
                    alert('Произошла ошибка при отправке. Пожалуйста, попробуйте еще раз.');
                    console.error('VK Integration Error:', error);
                });
            }, true); // Используем фазу захвата, чтобы перехватить событие до скриптов Tilda
        });
    }, 2000); // Ждем 2 секунды, чтобы Tilda точно сгенерировала форму
});
</script>
